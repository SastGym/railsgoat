name: SastGym ground-truth integrity

on:
  pull_request:
    paths:
      - 'sastgym/**'
      - '.github/workflows/sastgym-ground-truth.yml'
  push:
    branches: [main]
    paths:
      - 'sastgym/**'
      - '.github/workflows/sastgym-ground-truth.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r sastgym/requirements.txt
      - name: Verify annotation schema and immutable source
        run: python sastgym/validate.py
      - name: Verify contract rejection tests
        run: python -m unittest discover -s sastgym/tests -v
